name: Performa editorial source pool

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Optional single source URL; leave empty to run the whole pool"
        required: false
        type: string

permissions:
  contents: read

jobs:
  referral-pool:
    concurrency:
      group: performa-editorial-source-pool
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERFORMA_ORIGIN: "https://performa.com"
      REFERRAL_PARALLELISM: "5"
      REFERRAL_MAX_ATTEMPTS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate referral runner
        run: node --check scripts/run-performa-editorial-referral.mjs

      - name: Run editorial source pool
        shell: bash
        env:
          MANUAL_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -u

          results_dir="$RUNNER_TEMP/performa-editorial-results"
          sources_file="$RUNNER_TEMP/performa-editorial-sources-run.txt"
          rm -rf "$results_dir"
          mkdir -p "$results_dir"

          if [ -n "${MANUAL_SOURCE_URL:-}" ]; then
            printf '%s\n' "$MANUAL_SOURCE_URL" > "$sources_file"
          else
            shuf config/performa-editorial-sources.txt > "$sources_file"
          fi

          run_source() {
            source_url="$1"
            result_file="$2"
            max_attempts="${REFERRAL_MAX_ATTEMPTS:-2}"

            # Spread starts within the ten-minute window instead of hitting every publisher at once.
            delay=$((RANDOM % 50))
            sleep "$delay"

            echo "::group::Referral source: $source_url"
            attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "Attempt $attempt/$max_attempts"
              if REFERRAL_SOURCE_URL="$source_url" xvfb-run -a node scripts/run-performa-editorial-referral.mjs; then
                printf 'success\t%s\n' "$source_url" > "$result_file"
                echo "::endgroup::"
                return 0
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                retry_delay=$((5 + RANDOM % 11))
                echo "::warning::Referral attempt $attempt failed for $source_url; retrying in ${retry_delay}s"
                sleep "$retry_delay"
              fi
              attempt=$((attempt + 1))
            done

            printf 'failure\t%s\n' "$source_url" > "$result_file"
            echo "::warning::Referral source failed after $max_attempts attempts: $source_url"
            echo "::endgroup::"
            return 0
          }
          export -f run_source

          index=0
          while IFS= read -r source_url || [ -n "$source_url" ]; do
            [ -z "$source_url" ] && continue
            index=$((index + 1))

            bash -c 'run_source "$1" "$2"' _ "$source_url" "$results_dir/$index.tsv" &

            while [ "$(jobs -pr | wc -l | tr -d ' ')" -ge "$REFERRAL_PARALLELISM" ]; do
              wait -n || true
            done
          done < "$sources_file"

          wait || true

          successes=$(grep -h '^success' "$results_dir"/*.tsv 2>/dev/null | wc -l | tr -d ' ')
          failures=$(grep -h '^failure' "$results_dir"/*.tsv 2>/dev/null | wc -l | tr -d ' ')
          total=$((successes + failures))

          echo "Referral pool complete: total=$total successes=$successes failures=$failures"

          {
            echo "## Performa editorial source pool"
            echo
            echo "- Total: $total"
            echo "- Successes: $successes"
            echo "- Failures: $failures"
            echo
            if [ "$failures" -gt 0 ]; then
              echo "### Failed sources"
              grep -h '^failure' "$results_dir"/*.tsv 2>/dev/null | cut -f2- | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$successes" -eq 0 ]; then
            echo "No referral journey succeeded in this run."
            exit 1
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures of $total referral journeys failed after retries; keeping the scheduled pool run successful because at least one journey succeeded."
          fi

      - name: Upload referral results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performa-editorial-results-${{ github.run_id }}
          path: ${{ runner.temp }}/performa-editorial-results/*.tsv
          if-no-files-found: warn
