name: Search engines connectivity test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Google and Yandex
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const targets = [
            ['google_home', 'https://www.google.com/'],
            ['google_search', 'https://www.google.com/search?q=openai&hl=en&gl=us'],
            ['yandex_home', 'https://yandex.ru/'],
            ['yandex_search', 'https://yandex.ru/search/?text=openai'],
          ];

          const browser = await chromium.launch({ headless: true });
          const results = {};

          for (const [name, url] of targets) {
            const context = await browser.newContext({ locale: 'en-US' });
            const page = await context.newPage();
            const started = Date.now();
            const result = { requestedUrl: url };
            try {
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(1200);
              result.status = response?.status() ?? 0;
              result.finalUrl = page.url();
              result.title = await page.title();
              result.hostname = new URL(result.finalUrl).hostname;
              result.bodyPrefix = (await page.locator('body').innerText().catch(() => '')).slice(0, 700);
              result.googleChallenge = /sorry|unusual traffic|captcha|consent\.google/i.test(result.finalUrl + '\n' + result.title + '\n' + result.bodyPrefix);
              result.yandexChallenge = /showcaptcha|smartcaptcha|captcha|robot/i.test(result.finalUrl + '\n' + result.title + '\n' + result.bodyPrefix);
              result.searchInputs = await page.locator('input[name="q"], textarea[name="q"], input[type="search"], input[name="text"]').count();
            } catch (error) {
              result.error = error instanceof Error ? error.message : String(error);
              result.finalUrl = page.url();
            } finally {
              result.durationMs = Date.now() - started;
              results[name] = result;
              await context.close();
            }
          }

          await browser.close();
          fs.writeFileSync('search-engines-result.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          NODE

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: search-engines-result
          path: search-engines-result.json
          retention-days: 1
