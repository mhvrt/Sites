name: Bing href diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bing-href-diagnostic.yml'
      - 'scripts/debug-bing-hrefs.mjs'

permissions:
  contents: read

jobs:
  hrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - name: Capture raw Bing hrefs
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-hrefs.json
        run: node scripts/debug-bing-hrefs.mjs
      - name: Show diagnostic
        run: cat "${{ runner.temp }}/bing-hrefs.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bing-hrefs-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-hrefs.json
