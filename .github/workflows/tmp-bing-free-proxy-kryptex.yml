name: Temporary Bing free proxy Kryptex check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - name: Check Bing US through free US proxies
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote

          target = 'https://emcd.io/articles/mining/how-to-start-mining-with-kryptex-download-and-install/'.rstrip('/').lower()
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'
          api = 'https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=http&country=us&ssl=yes&timeout=3000'
          proxies = [x.strip() for x in requests.get(api, timeout=20).text.splitlines() if ':' in x][:50]
          print('PROXIES_LOADED', len(proxies))

          def blocked(text, url):
              z=((text or '')+' '+(url or '')).lower()
              return any(x in z for x in ['captcha','verify you are human','unusual traffic','challenge'])

          live_us=0
          bing_valid=0
          for proxy in proxies:
              px={'http':'http://'+proxy,'https':'http://'+proxy}
              try:
                  info=requests.get('https://ipinfo.io/json', proxies=px, timeout=5, headers={'User-Agent':ua})
                  if info.status_code!=200: continue
                  j=info.json()
                  if j.get('country')!='US': continue
                  live_us+=1
                  s=requests.Session(); s.proxies.update(px); s.headers.update({'User-Agent':ua,'Accept-Language':'en-US,en;q=0.9'})
                  page_results=[]
                  ok=True
                  for page,first in enumerate([1,11,21,31,41],1):
                      url=f'https://www.bing.com/search?q={quote("kryptex")}&cc=US&setlang=en-US&first={first}&FORM=PERE'
                      r=s.get(url,timeout=8,allow_redirects=True)
                      if r.status_code!=200 or blocked(r.text,r.url): ok=False; break
                      soup=BeautifulSoup(r.text,'html.parser')
                      organic=[]
                      for li in soup.select('li.b_algo'):
                          a=li.select_one('h2 a')
                          if a and a.get('href'): organic.append(a.get('href').strip())
                      if not organic: ok=False; break
                      page_results.append(organic)
                  if not ok: continue
                  bing_valid+=1
                  print('VALID_US_PROXY', j.get('ip'), j.get('region'), j.get('city'))
                  rank=0
                  for pidx,organic in enumerate(page_results):
                      base=[1,11,21,31,41][pidx]
                      for off,href in enumerate(organic):
                          if target == href.rstrip('/').lower() or target in href.rstrip('/').lower():
                              rank=base+off
                              print('RESULT CONFIRMED_HIT', rank, href)
                              raise SystemExit(42)
                  print('RESULT CONFIRMED_NO_HIT_TOP50')
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception:
                  continue

          print('RESULT NO_COMPLETE_VALID_PROXY_RUN live_us=',live_us,'bing_valid=',bing_valid)
          raise SystemExit(3)
