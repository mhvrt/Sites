name: Temporary Bing free proxy Kryptex check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Check Bing US through free US proxies
        shell: python
        run: |
          import requests, re, time, html
          from bs4 import BeautifulSoup
          from urllib.parse import quote, urlparse

          target = 'https://emcd.io/articles/mining/how-to-start-mining-with-kryptex-download-and-install/'
          target_norm = target.rstrip('/').lower()
          query = 'kryptex'

          # Public US HTTP proxies from ProxyScrape. No credentials are used.
          api = 'https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=http&country=us&ssl=yes&timeout=5000'
          r = requests.get(api, timeout=20)
          r.raise_for_status()
          proxies = [x.strip() for x in r.text.splitlines() if ':' in x][:80]
          print('Loaded proxies:', len(proxies))

          def challenge(text, final_url):
              t = (text or '').lower()
              u = (final_url or '').lower()
              markers = ['captcha', 'verify you are human', 'unusual traffic', 'challenge', 'sorry']
              return any(m in t for m in markers) or 'challenge' in u

          good = 0
          checked_pages = set()
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36'

          for proxy in proxies:
              purl = 'http://' + proxy
              px = {'http': purl, 'https': purl}
              try:
                  # Validate the proxy and that it is US.
                  ipr = requests.get('https://ipinfo.io/json', proxies=px, timeout=8, headers={'User-Agent': ua})
                  if ipr.status_code != 200:
                      continue
                  info = ipr.json()
                  if info.get('country') != 'US':
                      continue

                  print('\nPROXY', proxy, 'IP', info.get('ip'), 'region', info.get('region'), 'city', info.get('city'))
                  good += 1

                  # A single working proxy is used for all five result pages, preserving one session/IP.
                  sess = requests.Session()
                  sess.proxies.update(px)
                  sess.headers.update({'User-Agent': ua, 'Accept-Language': 'en-US,en;q=0.9'})

                  valid_this_proxy = True
                  for page, first in enumerate([1, 11, 21, 31, 41], start=1):
                      url = f'https://www.bing.com/search?q={quote(query)}&cc=US&setlang=en-US&first={first}&FORM=PERE'
                      sr = sess.get(url, timeout=12, allow_redirects=True)
                      print('PAGE', page, 'status', sr.status_code, 'url', sr.url, 'bytes', len(sr.text))
                      if sr.status_code != 200 or challenge(sr.text, sr.url):
                          print('PAGE', page, 'BLOCKED_OR_INVALID')
                          valid_this_proxy = False
                          break

                      soup = BeautifulSoup(sr.text, 'html.parser')
                      organic = []
                      for li in soup.select('li.b_algo'):
                          a = li.select_one('h2 a') or li.select_one('a')
                          if not a or not a.get('href'):
                              continue
                          href = a.get('href').strip()
                          title = a.get_text(' ', strip=True)
                          organic.append((href, title))

                      if not organic:
                          print('PAGE', page, 'NO_ORGANIC_RESULTS')
                          valid_this_proxy = False
                          break

                      print('ORGANIC_COUNT', len(organic))
                      for i, (href, title) in enumerate(organic, start=first):
                          hnorm = href.rstrip('/').lower()
                          print(f'RANK {i}: {href} | {title[:100]}')
                          if target_norm == hnorm or target_norm in hnorm:
                              print(f'CONFIRMED_HIT rank={i} page={page} proxy={proxy} ip={info.get("ip")}')
                              raise SystemExit(42)
                      checked_pages.add(page)

                  if valid_this_proxy and len(checked_pages) == 5:
                      print('CONFIRMED_NO_HIT_TOP50_WITH_VALID_US_PROXY', proxy, info.get('ip'))
                      raise SystemExit(0)

                  if good >= 12:
                      break
              except SystemExit:
                  raise
              except Exception as e:
                  print('proxy failed', proxy, type(e).__name__, str(e)[:180])

          print('NO_COMPLETE_VALID_PROXY_RUN; good_us_proxies=', good, 'pages_seen=', sorted(checked_pages))
          raise SystemExit(3)
