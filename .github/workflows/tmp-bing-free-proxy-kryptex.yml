name: Temporary Bing free proxy Kryptex check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests beautifulsoup4
      - name: Check Bing US through free US proxies
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote

          target='https://emcd.io/articles/mining/how-to-start-mining-with-kryptex-download-and-install/'.rstrip('/').lower()
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138.0.0.0 Safari/537.36'
          api='https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=http&country=us&ssl=yes&timeout=3000'
          proxies=[x.strip() for x in requests.get(api,timeout=20).text.splitlines() if ':' in x][:40]
          live_us=0
          bing_valid=0
          result='NO_COMPLETE_VALID_PROXY_RUN'
          details=[]

          def blocked(text,url):
              z=((text or '')+' '+(url or '')).lower()
              return any(x in z for x in ['captcha','verify you are human','unusual traffic','challenge'])

          for proxy in proxies:
              px={'http':'http://'+proxy,'https':'http://'+proxy}
              try:
                  info=requests.get('https://ipinfo.io/json',proxies=px,timeout=4,headers={'User-Agent':ua})
                  if info.status_code!=200: continue
                  j=info.json()
                  if j.get('country')!='US': continue
                  live_us+=1
                  s=requests.Session(); s.proxies.update(px); s.headers.update({'User-Agent':ua,'Accept-Language':'en-US,en;q=0.9'})
                  all_pages=[]; ok=True
                  for first in [1,11,21,31,41]:
                      u=f'https://www.bing.com/search?q={quote("kryptex")}&cc=US&setlang=en-US&first={first}&FORM=PERE'
                      r=s.get(u,timeout=7,allow_redirects=True)
                      if r.status_code!=200 or blocked(r.text,r.url): ok=False; break
                      soup=BeautifulSoup(r.text,'html.parser')
                      organic=[]
                      for li in soup.select('li.b_algo'):
                          a=li.select_one('h2 a')
                          if a and a.get('href'): organic.append(a.get('href').strip())
                      if not organic: ok=False; break
                      all_pages.append(organic)
                  if not ok: continue
                  bing_valid+=1
                  details.append(f'VALID_PROXY ip={j.get("ip")} region={j.get("region")} city={j.get("city")}')
                  hit=None
                  for pidx,organic in enumerate(all_pages):
                      base=[1,11,21,31,41][pidx]
                      for off,href in enumerate(organic):
                          if target==href.rstrip('/').lower() or target in href.rstrip('/').lower():
                              hit=(base+off,href); break
                      if hit: break
                  if hit:
                      result=f'CONFIRMED_HIT rank={hit[0]} url={hit[1]}'
                  else:
                      result='CONFIRMED_NO_HIT_TOP50'
                  break
              except Exception:
                  continue

          with open('bing-result.txt','w') as f:
              f.write(f'proxies_loaded={len(proxies)}\nlive_us={live_us}\nbing_valid={bing_valid}\nresult={result}\n')
              for d in details: f.write(d+'\n')
          print(open('bing-result.txt').read())
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bing-result
          path: bing-result.txt
