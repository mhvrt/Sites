name: Bing single rank verifier

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify subsocket.io in Bing US top 40
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          function decodeBing(href) {
            try {
              const u = new URL(href).searchParams.get('u');
              if (u && u.startsWith('a1')) return Buffer.from(u.slice(2), 'base64').toString('utf8');
            } catch {}
            return href;
          }
          const norm = h => (h||'').toLowerCase().replace(/^www\./,'');

          (async () => {
            const domain='subsocket.io', query='DGB hashrate chart';
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({locale:'en-US'});
            const page = await context.newPage();
            const report={domain,query,market:'US/en-US',pages:[],hit:null,checkedAt:new Date().toISOString()};
            for (let p=0;p<4;p++) {
              const first=1+p*10;
              const url='https://www.bing.com/search?q='+encodeURIComponent(query)+'&setlang=en-US&cc=US&first='+first;
              const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1200);
              const raw=await page.locator('li.b_algo').evaluateAll((lis)=>lis.map(li=>{
                const a=li.querySelector('h2 a[href]');
                return a?{title:(a.textContent||'').trim(),href:a.href}:null;
              }).filter(Boolean));
              const results=raw.map((r,i)=>{
                const target=decodeBing(r.href);
                let host=''; try{host=new URL(target).hostname}catch{}
                return {rank:p*10+i+1,title:r.title,url:target,host};
              });
              const body=(await page.locator('body').innerText()).slice(0,500);
              report.pages.push({page:p+1,status:resp?resp.status():null,finalUrl:page.url(),count:results.length,results,bodyPrefix:body});
              const hit=results.find(r=>{const h=norm(r.host); return h===domain || h.endsWith('.'+domain)});
              if(hit){report.hit=hit;break;}
              await page.waitForTimeout(1000);
            }
            await browser.close();
            fs.writeFileSync('bing-single-rank.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.hit,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bing-single-rank
          path: bing-single-rank.json
          retention-days: 1
