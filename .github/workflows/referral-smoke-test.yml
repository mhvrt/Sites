name: Referral smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bing-next:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        target_pages: [2, 3, 4, 5]
    name: bing-next-${{ matrix.browser }}-p${{ matrix.target_pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test physical Bing pagination
        env:
          BROWSER: ${{ matrix.browser }}
          TARGET_PAGES: ${{ matrix.target_pages }}
          REPORT_PATH: ${{ runner.temp }}/bing-next-click.json
        run: node scripts/debug-bing-next-click.mjs
      - name: Show report
        if: always()
        run: cat "${{ runner.temp }}/bing-next-click.json" || true
