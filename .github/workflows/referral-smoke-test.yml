name: Referral smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bing-next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - name: Test physical Bing pagination
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-next-click.json
        run: node scripts/debug-bing-next-click.mjs
      - name: Show report
        run: cat "${{ runner.temp }}/bing-next-click.json"
      - uses: actions/upload-artifact@v4
        with:
          name: bing-next-click-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-next-click.json
