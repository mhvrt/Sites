name: Referral smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - name: Run Bing to EMCD smoke test
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-smoke.json
        run: node scripts/run-bing-antminer-qa.mjs
      - name: Show Bing report
        if: always()
        run: cat "${{ runner.temp }}/bing-smoke.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bing-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-smoke.json
          if-no-files-found: warn

  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERFORMA_ORIGIN: "https://performa.com"
      REFERRAL_PARALLELISM: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Validate referral runner
        run: node --check scripts/run-performa-editorial-referral.mjs
      - name: Run all editorial referral sources once
        shell: bash
        run: |
          set -u
          results_dir="$RUNNER_TEMP/editorial-smoke"
          sources_file="$RUNNER_TEMP/editorial-smoke-sources.txt"
          rm -rf "$results_dir"
          mkdir -p "$results_dir"

          {
            cat config/performa-editorial-sources.txt
            echo "https://www.thestreet.com/crypto/newsroom/how-stablecoins-and-fintech-platforms-are-reshaping-business-payments"
            echo "https://www.bbntimes.com/financial/five-financial-bottlenecks-slowing-down-international-growth"
          } | awk 'NF && !seen[$0]++' > "$sources_file"

          run_source() {
            source_url="$1"
            result_file="$2"
            log_file="$3"
            if REFERRAL_SOURCE_URL="$source_url" xvfb-run -a node scripts/run-performa-editorial-referral.mjs >"$log_file" 2>&1; then
              printf 'success\t%s\n' "$source_url" > "$result_file"
            else
              printf 'failure\t%s\n' "$source_url" > "$result_file"
            fi
          }
          export -f run_source

          index=0
          while IFS= read -r source_url || [ -n "$source_url" ]; do
            [ -z "$source_url" ] && continue
            index=$((index + 1))
            bash -c 'run_source "$1" "$2" "$3"' _ "$source_url" "$results_dir/$index.tsv" "$results_dir/$index.log" &
            while [ "$(jobs -pr | wc -l | tr -d ' ')" -ge "$REFERRAL_PARALLELISM" ]; do
              wait -n || true
            done
          done < "$sources_file"
          wait || true

          successes=$(grep -h '^success' "$results_dir"/*.tsv 2>/dev/null | wc -l | tr -d ' ')
          failures=$(grep -h '^failure' "$results_dir"/*.tsv 2>/dev/null | wc -l | tr -d ' ')
          total=$((successes + failures))
          echo "SMOKE_RESULT total=$total successes=$successes failures=$failures"
          echo "--- STATUS ---"
          cat "$results_dir"/*.tsv 2>/dev/null || true

          if [ "$failures" -gt 0 ]; then
            echo "--- FAILED LOGS ---"
            for result in "$results_dir"/*.tsv; do
              [ -f "$result" ] || continue
              if grep -q '^failure' "$result"; then
                base="${result%.tsv}"
                echo "### $(cut -f2- "$result")"
                tail -n 80 "$base.log" || true
              fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/editorial-smoke/*
          if-no-files-found: warn
