name: Bing US top10 all domains

on:
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 01
            domain: angrymonky.com
            query: Kryptex
          - id: 02
            domain: journeyofstardust.com
            query: Solana Price
          - id: 03
            domain: tothesmart.com
            query: bitcoin crash
          - id: 04
            domain: gemstock.tech
            query: Blockchair
          - id: 05
            domain: buildsquad.net
            query: best dogecoin wallets
          - id: 06
            domain: uniquebinars.io
            query: Maschinenring mining
          - id: 07
            domain: subsocket.io
            query: DGB hashrate chart
          - id: 08
            domain: kryptobulls.io
            query: crypto payment gateway without kyc
          - id: 09
            domain: spectachain.io
            query: is xrp a stablecoin
          - id: 10
            domain: solamatrendz.com
            query: Solama Coin
          - id: 11
            domain: bitcash.dev
            query: how to buy stablecoin
          - id: 12
            domain: bitdova.com
            query: is crypto dead
          - id: 13
            domain: docstr.app
            query: how to mine bitcoin
          - id: 14
            domain: nftworldnews.tech
            query: what is a nonce crypto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check first Bing US page
        env:
          CHECK_ID: ${{ matrix.id }}
          DOMAIN: ${{ matrix.domain }}
          QUERY: ${{ matrix.query }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          function decodeBing(href){try{const u=new URL(href).searchParams.get('u');if(u&&u.startsWith('a1'))return Buffer.from(u.slice(2),'base64').toString('utf8')}catch{}return href}
          const norm=h=>(h||'').toLowerCase().replace(/^www\./,'');
          (async()=>{
            const domain=process.env.DOMAIN, query=process.env.QUERY, id=process.env.CHECK_ID;
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({locale:'en-US'});
            const page=await context.newPage();
            const url='https://www.bing.com/search?q='+encodeURIComponent(query)+'&setlang=en-US&cc=US&first=1';
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const raw=await page.locator('li.b_algo').evaluateAll(lis=>lis.map(li=>{const a=li.querySelector('h2 a[href]');return a?{title:(a.textContent||'').trim(),href:a.href}:null}).filter(Boolean));
            const results=raw.slice(0,10).map((r,i)=>{const target=decodeBing(r.href);let host='';try{host=new URL(target).hostname}catch{}return{rank:i+1,title:r.title,url:target,host}});
            const hit=results.find(r=>{const h=norm(r.host);return h===norm(domain)||h.endsWith('.'+norm(domain))})||null;
            const body=(await page.locator('body').innerText()).slice(0,500);
            const out={id,domain,query,market:'US/en-US',status:resp?resp.status():null,finalUrl:page.url(),count:results.length,hit,results,challenge:/one last step|solve the challenge|captcha/i.test(body),bodyPrefix:body,checkedAt:new Date().toISOString()};
            fs.writeFileSync(`bing-top10-${id}.json`,JSON.stringify(out,null,2));
            console.log(JSON.stringify({id,domain,query,hit,challenge:out.challenge,count:results.length},null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bing-top10-${{ matrix.id }}
          path: bing-top10-${{ matrix.id }}.json
          retention-days: 1
