name: Bing v7 smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bing-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - name: Run Bing v7 end-to-end
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-v7.json
          BING_MAX_ATTEMPTS: "5"
          REQUIRED_EMCD_PAGES: "4"
        run: node scripts/run-bing-antminer-referral-v7.mjs
      - name: Show report
        if: always()
        run: cat "${{ runner.temp }}/bing-v7.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bing-v7-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-v7.json
          if-no-files-found: warn
