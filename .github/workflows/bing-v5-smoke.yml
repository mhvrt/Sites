name: Bing v5 smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bing-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox
      - name: Run Bing v5 end-to-end
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-v5.json
          BING_MAX_ATTEMPTS: "3"
          BING_MAX_SERP_PAGES: "5"
        run: node scripts/run-bing-antminer-referral-v5.mjs
      - name: Show report
        if: always()
        run: cat "${{ runner.temp }}/bing-v5.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bing-v5-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-v5.json
          if-no-files-found: warn
