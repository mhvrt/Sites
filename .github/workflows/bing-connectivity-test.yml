name: Bing connectivity test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bing-connectivity-test.yml

permissions:
  contents: read

jobs:
  bing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open Bing with Playwright
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const started = Date.now();
          try {
            const response = await page.goto('https://www.bing.com/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            console.log('BING_RESULT=' + JSON.stringify({
              ok: true,
              status: response?.status() ?? null,
              finalUrl: page.url(),
              title: await page.title(),
              durationMs: Date.now() - started,
            }));
          } catch (error) {
            console.error('BING_RESULT=' + JSON.stringify({
              ok: false,
              error: error instanceof Error ? error.message : String(error),
              finalUrl: page.url(),
              durationMs: Date.now() - started,
            }));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE
