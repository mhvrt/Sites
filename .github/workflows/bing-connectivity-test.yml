name: Bing connectivity test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bing-connectivity-test.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Bing response
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const started = Date.now();
          const result = { startedAt: new Date().toISOString() };
          try {
            const response = await page.goto('https://www.bing.com/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await page.waitForTimeout(1500);
            result.status = response?.status() ?? 0;
            result.finalUrl = page.url();
            result.title = await page.title();
            result.hostname = new URL(result.finalUrl).hostname;
            result.searchInputs = await page.locator('input[name="q"], textarea[name="q"], input[type="search"]').count();
            result.bodyPrefix = (await page.locator('body').innerText().catch(() => '')).slice(0, 300);
          } catch (error) {
            result.error = error instanceof Error ? error.message : String(error);
            result.finalUrl = page.url();
          } finally {
            result.durationMs = Date.now() - started;
            fs.writeFileSync('bing-result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result));
            await browser.close();
          }
          NODE

      - name: Upload Bing result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bing-result
          path: bing-result.json
          retention-days: 1

      - name: Validate navigation completed
        if: always()
        run: node -e "const r=require('./bing-result.json'); if(r.error) { console.error(r.error); process.exit(1) }"

      - name: Validate HTTP below 400
        if: always()
        run: node -e "const r=require('./bing-result.json'); if(!(r.status>0 && r.status<400)) { console.error('status='+r.status); process.exit(1) }"

      - name: Validate Bing hostname
        if: always()
        run: node -e "const r=require('./bing-result.json'); if(!(r.hostname==='bing.com'||String(r.hostname||'').endsWith('.bing.com'))) { console.error('hostname='+r.hostname); process.exit(1) }"

      - name: Validate Bing title
        if: always()
        run: node -e "const r=require('./bing-result.json'); if(!/bing/i.test(String(r.title||''))) { console.error('title='+r.title); process.exit(1) }"

      - name: Validate search UI present
        if: always()
        run: node -e "const r=require('./bing-result.json'); if(!(r.searchInputs>=1)) { console.error('searchInputs='+r.searchInputs); process.exit(1) }"
