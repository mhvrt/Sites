name: Bing connectivity test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bing-connectivity-test.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open and validate Bing with Playwright
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const started = Date.now();
          try {
            const response = await page.goto('https://www.bing.com/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            const status = response?.status() ?? 0;
            const finalUrl = page.url();
            const title = await page.title();
            const hostname = new URL(finalUrl).hostname;
            const searchInputs = await page.locator('input[name="q"], textarea[name="q"]').count();
            const result = {
              status,
              finalUrl,
              title,
              hostname,
              searchInputs,
              durationMs: Date.now() - started,
            };
            console.log('BING_RESULT=' + JSON.stringify(result));
            if (status >= 400) throw new Error(`bing_http_${status}`);
            if (!(hostname === 'bing.com' || hostname.endsWith('.bing.com'))) throw new Error(`unexpected_host_${hostname}`);
            if (!/bing/i.test(title)) throw new Error(`unexpected_title_${title}`);
            if (searchInputs < 1) throw new Error('bing_search_input_missing');
          } catch (error) {
            console.error('BING_ERROR=' + (error instanceof Error ? error.message : String(error)));
            process.exitCode = 1;
          } finally {
            await browser.close();
          }
          NODE
