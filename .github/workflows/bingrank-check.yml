name: BingRank checker validation

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Check all supplied rankings via BingRank
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const checks=[
            ['angrymonky.com','Kryptex'],
            ['journeyofstardust.com','Solana Price'],
            ['tothesmart.com','bitcoin crash'],
            ['gemstock.tech','Blockchair'],
            ['buildsquad.net','best dogecoin wallets'],
            ['uniquebinars.io','Maschinenring mining'],
            ['subsocket.io','DGB hashrate chart'],
            ['kryptobulls.io','crypto payment gateway without kyc'],
            ['spectachain.io','is xrp a stablecoin'],
            ['solamatrendz.com','Solama Coin'],
            ['bitcash.dev','how to buy stablecoin'],
            ['bitdova.com','is crypto dead'],
            ['docstr.app','how to mine bitcoin'],
            ['nftworldnews.tech','what is a nonce crypto']
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({locale:'en-US'});
            const report={checkedAt:new Date().toISOString(),checks:[]};
            for(const [domain,query] of checks){
              const page=await context.newPage();
              const entry={domain,query};
              try{
                const res=await page.goto('https://bingrank.com/',{waitUntil:'domcontentloaded',timeout:30000});
                entry.homeStatus=res?res.status():null;
                const texts=page.locator('input[type="text"]');
                await texts.nth(0).fill(domain);
                await texts.nth(1).fill(query);
                const btn=page.getByRole('button',{name:/check rank/i}).first();
                await Promise.all([
                  page.waitForURL(/index\.php/,{timeout:30000}),
                  btn.click()
                ]);
                await page.waitForTimeout(300);
                entry.finalUrl=page.url();
                entry.body=(await page.locator('body').innerText()).slice(0,16000);
                const lines=entry.body.split(/\n+/).map(s=>s.trim()).filter(Boolean);
                entry.resultLines=lines.filter(s=>
                  s.includes(domain) ||
                  /not found in the top \d+ results/i.test(s) ||
                  /rank(?:ing)?(?:\s+position)?\s*[:#]?\s*\d+/i.test(s) ||
                  /position\s*[:#]?\s*\d+/i.test(s)
                ).slice(0,30);
                entry.notFound=/not found in the top \d+ results/i.test(entry.body);
                const rankMatch=entry.body.match(/(?:rank(?:ing)?(?:\s+position)?|position)\s*[:#]?\s*(\d+)/i);
                entry.detectedRank=rankMatch?Number(rankMatch[1]):null;
                const totalMatch=entry.body.match(/Total results found:\s*(\d+)/i);
                entry.totalResultsFound=totalMatch?Number(totalMatch[1]):null;
              }catch(e){entry.error=String(e&&e.message||e);entry.body=(await page.locator('body').innerText().catch(()=>'' )).slice(0,8000);}
              report.checks.push(entry);
              await page.close();
            }
            fs.writeFileSync('bingrank-result.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report.checks.map(x=>({domain:x.domain,query:x.query,error:x.error,notFound:x.notFound,detectedRank:x.detectedRank,totalResultsFound:x.totalResultsFound,resultLines:x.resultLines,bodyPrefix:(x.body||'').slice(0,900)})),null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bingrank-result-all
          path: bingrank-result.json
          retention-days: 1
