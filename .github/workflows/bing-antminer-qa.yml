name: Bing Antminer QA

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    concurrency:
      group: bing-antminer-qa-${{ github.event.schedule || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox
      - name: Random second jitter
        shell: bash
        run: |
          delay=$((RANDOM % 50))
          echo "Random Bing QA delay: ${delay}s"
          sleep "$delay"
      - name: Run synthetic Bing referral
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-antminer-qa.json
          BING_MAX_ATTEMPTS: "3"
          BING_MAX_SERP_PAGES: "5"
        run: node scripts/run-bing-antminer-referral-v2.mjs
      - name: Publish summary
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-antminer-qa.json
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          let r = {};
          try { r = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8')); } catch {}
          console.log('## Bing Antminer referral');
          console.log(`- Query: \`${r.query || 'antminer s9'}\``);
          console.log(`- Expected title: \`${r.expectedTitle || 'Mining with Antminer S9 ASIC: Is It Still Profitable?'}\``);
          console.log(`- Matched title: \`${r.matchedTitle || 'not found'}\``);
          console.log(`- Successful attempt: \`${r.successfulAttempt ?? 'none'}\``);
          console.log(`- SERP page: \`${r.serpPage ?? 'not found'}\``);
          console.log(`- Rank: \`${r.rank ?? 'not found'}\``);
          console.log(`- Clicked: \`${r.clicked ? 'yes' : 'no'}\``);
          if (Array.isArray(r.attempts) && r.attempts.length) {
            console.log('- Attempts:');
            for (const a of r.attempts) {
              const pages = Array.isArray(a.pages) ? a.pages.map((p) => `p${p.page}:${p.challenge ? 'challenge' : `${p.resultCount} results`}`).join(', ') : '';
              const mode = a.searchMode ? ` via ${a.searchMode}` : '';
              console.log(`  - #${a.number} ${a.browser}: ${a.status}${mode}${pages ? ` (${pages})` : ''}${a.error ? ` — ${a.error}` : ''}`);
            }
          }
          console.log(`- EMCD pages visited: \`${r.emcdPagesVisited ?? 0}\``);
          console.log(`- Final URL: \`${r.finalUrl || 'n/a'}\``);
          console.log(`- Referrer: \`${r.referrer || 'n/a'}\``);
          if (Array.isArray(r.emcdRoute) && r.emcdRoute.length) {
            console.log('- EMCD route:');
            for (const url of r.emcdRoute) console.log(`  - ${url}`);
          }
          console.log(`- Error: \`${r.error || 'none'}\``);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bing-antminer-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-antminer-qa.json
