name: Manual Bing Antminer QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps firefox
      - name: Run synthetic Bing QA click
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-antminer-qa.json
        run: node scripts/run-bing-antminer-qa.mjs
      - name: Publish summary
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-antminer-qa.json
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          let r = {};
          try { r = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8')); } catch {}
          console.log('## Bing Antminer QA');
          console.log(`- Synthetic: \`${r.synthetic ? 'yes' : 'unknown'}\``);
          console.log(`- Bing region: \`${r.bingRegion || 'unknown'}\``);
          console.log(`- Bing market: \`${r.bingMarket || 'unknown'}\``);
          console.log(`- Rank: \`${r.rank ?? 'not found'}\``);
          console.log(`- Clicked: \`${r.clicked ? 'yes' : 'no'}\``);
          console.log(`- Final URL: \`${r.finalUrl || 'n/a'}\``);
          console.log(`- Referrer: \`${r.referrer || 'n/a'}\``);
          console.log(`- Error: \`${r.error || 'none'}\``);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bing-antminer-qa
          path: ${{ runner.temp }}/bing-antminer-qa.json
