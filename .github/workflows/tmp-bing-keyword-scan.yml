name: Temporary Bing Antminer verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: "Antminer S9 first=${{ matrix.first }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        first: [1, 11]
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps firefox
      - name: Verify Bing US result
        env:
          FIRST: "${{ matrix.first }}"
        run: |
          node <<'NODE'
          const { firefox } = require('playwright');
          const fs = require('fs');
          const first = Number(process.env.FIRST);
          const targetDomain = 'emcd.io';
          function decodeBing(href) {
            try {
              const u = new URL(href);
              const x = u.searchParams.get('u') || '';
              if (x.startsWith('a1')) {
                let raw = x.slice(2).replace(/-/g,'+').replace(/_/g,'/');
                while (raw.length % 4) raw += '=';
                return Buffer.from(raw,'base64').toString('utf8');
              }
            } catch {}
            return href;
          }
          (async()=>{
            const browser = await firefox.launch({headless:true});
            const context = await browser.newContext({locale:'en-US',timezoneId:'America/New_York'});
            const page = await context.newPage();
            const url=`https://www.bing.com/search?q=${encodeURIComponent('antminer s9')}&cc=US&setlang=en-US&first=${first}&FORM=PERE`;
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(2500);
            const body=(await page.locator('body').innerText().catch(()=>''))||'';
            const blocked=/verify you are human|unusual traffic|captcha/i.test(body+' '+page.url());
            const market=await page.evaluate(()=>({lang:document.documentElement.lang,region:globalThis._G?.Region,mkt:globalThis._G?.Mkt})).catch(()=>({}));
            const results=await page.locator('li.b_algo').evaluateAll(lis=>lis.map(li=>{const a=li.querySelector('h2 a');return a?{href:a.href,title:(a.textContent||'').trim()}:null}).filter(Boolean));
            let out={first,status:resp&&resp.status(),finalUrl:page.url(),blocked,market,results:results.map((r,i)=>({rank:first+i,href:r.href,dest:decodeBing(r.href),title:r.title}))};
            out.hits=out.results.filter(r=>(r.dest+' '+r.href).toLowerCase().includes(targetDomain));
            fs.writeFileSync(`verify-${first}.json`,JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=2});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "antminer-${{ matrix.first }}"
          path: "verify-${{ matrix.first }}.json"
