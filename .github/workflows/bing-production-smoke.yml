name: Bing production smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bing-target-click:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify Bing target click
        env:
          REPORT_PATH: ${{ runner.temp }}/bing-target-click.json
        run: node scripts/debug-bing-target-click.mjs
      - name: Show report
        if: always()
        run: cat "${{ runner.temp }}/bing-target-click.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bing-target-click-${{ github.run_id }}
          path: ${{ runner.temp }}/bing-target-click.json
          if-no-files-found: warn
